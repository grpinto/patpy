name: Test patpy-analysis-mcp

# Mirrors test-patpy-mcp.yaml but scoped to the patpy-analysis-mcp subproject
# under ``mcp-analysis/``. The dependency tree here is heavier (patpy +
# scanpy + matplotlib + scikit-learn), so this workflow is also slower than
# the patpy-mcp one — keep that in mind when adding new tests.
on:
  push:
    branches: [main]
    paths:
      - "mcp-analysis/**"
      - ".github/workflows/test-patpy-analysis-mcp.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mcp-analysis/**"
      - ".github/workflows/test-patpy-analysis-mcp.yaml"
  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: mcp-analysis

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          cache-dependency-glob: mcp-analysis/pyproject.toml

      - name: Install patpy-analysis-mcp[test]
        run: uv pip install --system -e ".[test]"

      - name: Run pytest
        env:
          MPLBACKEND: agg
        run: pytest -v --color=yes

  check:
    name: All patpy-analysis-mcp tests pass
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
